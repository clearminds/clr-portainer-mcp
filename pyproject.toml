[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clr-portainer-mcp"
version = "1.0.0"
description = "MCP server for Portainer container management"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "clearminds"}]
keywords = ["mcp", "portainer", "docker", "container"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=2.14.0,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.urls]
Repository = "https://github.com/clearminds/clr-portainer-mcp"

[project.scripts]
clr-portainer-mcp = "clr_portainer_mcp.server:main"
